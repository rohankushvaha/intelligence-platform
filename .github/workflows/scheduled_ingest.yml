# ═══════════════════════════════════════════════════════════════════════════
# LIP v2 — Scheduled Ingestion via GitHub Actions (Crawl4AI edition)
# No API key needed for crawling — Crawl4AI is completely free.
#
# Schedule: Every Sunday at 8:30pm UTC = Monday 2:00am IST
# ═══════════════════════════════════════════════════════════════════════════

name: LIP v2 — Scheduled Ingestion

on:
  schedule:
    - cron: "30 20 * * 0"   # Sunday 20:30 UTC = Monday 02:00 IST

  workflow_dispatch:
    inputs:
      source_type:
        description: "Which source tier to ingest"
        required: false
        default: "official"
        type: choice
        options:
          - all
          - official
          - press
          - competitive

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Cache HuggingFace models (~90MB all-MiniLM + ~480MB sentiment model)
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v2
          restore-keys: |
            ${{ runner.os }}-hf-

      # Cache Playwright browser (Crawl4AI uses Chromium, ~170MB)
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: pip install -r ingestion/requirements.txt

      # One-time Crawl4AI setup — installs Playwright's Chromium browser.
      # Cached above so only downloads once, reused on all subsequent runs.
      - name: Set up Crawl4AI browser
        run: crawl4ai-setup

      - name: Run ingestion pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT:    "lip-v2-ingestion"
        run: |
          if [ "${{ github.event.inputs.source_type }}" = "all" ] || [ -z "${{ github.event.inputs.source_type }}" ]; then
            python ingestion/ingest.py 2>&1 | tee run_output.txt
          else
            python ingestion/ingest.py --source-type ${{ github.event.inputs.source_type }} 2>&1 | tee run_output.txt
          fi

      - name: Post run summary to GitHub Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('run_output.txt', 'utf8');
            const summary = output.slice(-3000);
            const now = new Date().toISOString();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: 1,
              body: `## ✅ Ingestion Run — ${now}\n\`\`\`\n${summary}\n\`\`\``
            });

      - name: Create failure issue on error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('run_output.txt', 'utf8').slice(-2000); } catch(e) {}
            const now = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Ingestion Failed — ${now}`,
              body:  `The scheduled ingestion pipeline failed.\n\n\`\`\`\n${output}\n\`\`\`\n\nCheck the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details.`,
              labels: ["ingestion-failure"]
            });
