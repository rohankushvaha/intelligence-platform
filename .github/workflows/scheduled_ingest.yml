# ═══════════════════════════════════════════════════════════════════════════
# LIP v2 — Scheduled Ingestion via GitHub Actions
# File: .github/workflows/scheduled_ingest.yml
#
# Schedule: Every Sunday at 8:30pm UTC = Monday 2:00am IST
# Manual trigger available with source_type selector.
# ═══════════════════════════════════════════════════════════════════════════

name: LIP v2 — Scheduled Ingestion

on:
  schedule:
    - cron: "30 20 * * 0"   # Sunday 20:30 UTC = Monday 02:00 IST

  workflow_dispatch:         # Manual trigger from GitHub Actions UI
    inputs:
      source_type:
        description: "Which source tier to ingest"
        required: false
        default: "official"
        type: choice
        options:
          - all
          - official
          - press
          - competitive

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # hard cap — free tier has 2,000 min/month

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"          # caches pip downloads between runs

      # ── 3. Cache HuggingFace model (~90MB) ──────────────────────────────
      # Without this, every run re-downloads all-MiniLM-L6-v2.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-minilm-l6-v2
          restore-keys: |
            ${{ runner.os }}-hf-

      # ── 4. Install dependencies ─────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r ingestion/requirements.txt

      # ── 5. Run ingestion ────────────────────────────────────────────────
      - name: Run ingestion pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIRECRAWL_API_KEY:    ${{ secrets.FIRECRAWL_API_KEY }}
          LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT:    "lip-v2-ingestion"
        run: |
          # If triggered manually with 'all', run without --source-type flag
          if [ "${{ github.event.inputs.source_type }}" = "all" ] || [ -z "${{ github.event.inputs.source_type }}" ]; then
           python ingestion/ingest.py 2>&1 | tee run_output.txt
          else
            python ingestion/ingest.py --source-type ${{ github.event.inputs.source_type }} 2>&1 | tee run_output.txt
          fi

      # ── 6. Post summary to GitHub Issue #1 (acts as run log) ───────────
      - name: Post run summary to GitHub Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('run_output.txt', 'utf8');
            const summary = output.slice(-3000); // last 3000 chars
            const now = new Date().toISOString();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: 1,               // Create Issue #1 manually titled "Ingestion Run Log"
              body: `## ✅ Ingestion Run — ${now}\n\`\`\`\n${summary}\n\`\`\``
            });

      # ── 7. Create failure issue if run fails ────────────────────────────
      - name: Create failure issue on error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('run_output.txt', 'utf8').slice(-2000); } catch(e) {}
            const now = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Ingestion Failed — ${now}`,
              body:  `The scheduled ingestion pipeline failed.\n\n\`\`\`\n${output}\n\`\`\`\n\nCheck the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details.`,
              labels: ["ingestion-failure"]
            });
