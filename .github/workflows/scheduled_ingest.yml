# ═══════════════════════════════════════════════════════════════════════════
# LIP v2 — Scheduled Ingestion (fixed permissions + crawl4ai imports)
# ═══════════════════════════════════════════════════════════════════════════

name: LIP v2 — Scheduled Ingestion

on:
  schedule:
    - cron: "30 20 * * 0"
  workflow_dispatch:
    inputs:
      source_type:
        description: "Which source tier to ingest"
        required: false
        default: "official"
        type: choice
        options:
          - all
          - official
          - press
          - competitive

# ── Fix for 403 error: grant write access to Issues ──────────────────────
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v2
          restore-keys: ${{ runner.os }}-hf-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Set up Crawl4AI browser
        run: crawl4ai-setup

      - name: Run ingestion pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT:    "lip-v2-ingestion"
        run: |
          if [ "${{ github.event.inputs.source_type }}" = "all" ] || [ -z "${{ github.event.inputs.source_type }}" ]; then
            python ingestion/ingest.py 2>&1 | tee run_output.txt
          else
            python ingestion/ingest.py --source-type ${{ github.event.inputs.source_type }} 2>&1 | tee run_output.txt
          fi

      - name: Post run summary to GitHub Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('run_output.txt', 'utf8').slice(-3000); } catch(e) { output = 'No output captured.'; }
            const now = new Date().toISOString();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: 1,
              body: `## ✅ Ingestion Run — ${now}\n\`\`\`\n${output}\n\`\`\``
            });

      - name: Create failure issue on error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('run_output.txt', 'utf8').slice(-2000); } catch(e) { output = 'No output file found.'; }
            const now = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Ingestion Failed — ${now}`,
              body:  `Pipeline failed.\n\n\`\`\`\n${output}\n\`\`\`\n\n[View full logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              labels: ["ingestion-failure"]
            });
